name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O Prisma Client é gerado, não versionado: sem isto o typecheck falha
      # por não encontrar os tipos dos models.
      - run: pnpm exec prisma generate
        env:
          DIRECT_URL: postgresql://user:pass@localhost:5432/placeholder

      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      - run: pnpm test

      # SKIP_ENV_VALIDATION porque o CI não tem — nem deve ter — os segredos
      # de produção. O objetivo aqui é compilar, não servir tráfego.
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          DIRECT_URL: postgresql://user:pass@localhost:5432/placeholder
