name: CI

on:
  push:
    branches: [main, lacunas-billing-qualidade]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O Prisma Client é gerado, não versionado: sem isto o typecheck falha
      # por não encontrar os tipos dos models.
      - run: pnpm exec prisma generate
        env:
          DIRECT_URL: postgresql://user:pass@localhost:5432/placeholder

      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      - run: pnpm test

      # SKIP_ENV_VALIDATION porque o CI não tem — nem deve ter — os segredos
      # de produção. O objetivo aqui é compilar, não servir tráfego.
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          DIRECT_URL: postgresql://user:pass@localhost:5432/placeholder

  # Suíte de integração (E10-02): Postgres efêmero, criado e destruído com o
  # job. Nunca toca banco de verdade — o setup recusa host que não seja local
  # e banco cujo nome não contenha "test".
  integracao:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: painel
          POSTGRES_PASSWORD: painel
          POSTGRES_DB: painel_test
        ports:
          - 5432:5432
        # Sem o healthcheck, os testes começam antes de o Postgres aceitar
        # conexão e falham por P1001 sem relação com o código.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://painel:painel@localhost:5432/painel_test
      DIRECT_URL: postgresql://painel:painel@localhost:5432/painel_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      - run: pnpm test:integration

  # E2E (E10-03): navegador de verdade contra o app compilado, com Postgres
  # efêmero e um Supabase Auth de mentira. Nenhuma API externa é chamada.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: painel
          POSTGRES_PASSWORD: painel
          POSTGRES_DB: painel_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://painel:painel@localhost:5432/painel_e2e_test
      DIRECT_URL: postgresql://painel:painel@localhost:5432/painel_e2e_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy

      - run: pnpm exec playwright install chromium --with-deps

      # O build precisa das mesmas variáveis públicas que o servidor de teste
      # usa: NEXT_PUBLIC_ é embutida em tempo de build, não lida em runtime.
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-de-teste
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
