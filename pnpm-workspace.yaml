allowBuilds:
  # Prisma precisa do postinstall para baixar os query engines nativos.
  '@prisma/engines': true
  prisma: true
  # Compilam binários próprios: esbuild no tooling, sharp na otimização de
  # imagem do Next, unrs-resolver no ESLint.
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Baixa o binário usado para enviar source maps no build. Sem ele, um build
  # com SENTRY_AUTH_TOKEN configurado falharia na hora do upload.
  '@sentry/cli': true
